
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Aluno</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Editar Aluno</h1>

    <a href="/alunos">
        <button>Voltar</button>
    </a>

    <form action="/alunos/atualizar/{{ aluno[0] }}" method="post">
        <label>Nome:</label>
        <input type="text" name="nome" value="{{ aluno[1] }}" required>

        <label>Plano:</label>
        <input type="text" name="plano" value="{{ aluno[2] }}" required>

        <label>Idade:</label>
        <input type="number" name="idade" value="{{ aluno[3] }}" required>

        <label>Mensalidade:</label>
        <input type="number" step="0.01" name="mensalidade" value="{{ aluno[4] }}" required>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
